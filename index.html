<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ทำนายฝน</title>
<meta name="theme-color" content="#5AA7E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="t-day-dry">
<div id="skyA" class="on"></div><div id="skyB"></div>
<div id="orb">☀️</div>
<main>
<h1>🌦️ ทำนายฝน</h1>
<p id="upd">กำลังโหลด…</p>
<div id="note" class="note" hidden></div>
<button id="gps" type="button">📍 ใช้ตำแหน่งของฉัน</button>
<div class="srow"><input id="q" placeholder="หรือพิมพ์ชื่อที่ เช่น เชียงใหม่" aria-label="ค้นหาสถานที่"><button id="find">ค้นหา</button></div>
<div id="chips"></div>

<section id="now" hidden>
  <div class="row1">
    <div id="nw-icon">⛅</div>
    <div id="nw-main">
      <p id="nw-temp">—</p>
      <p id="nw-label">—</p>
      <div id="nw-meta">
        <span>💧 โอกาสตก <b id="nw-pp">—</b></span>
        <span>🌧 ปริมาณ <b id="nw-mm">—</b></span>
      </div>
    </div>
  </div>
  <p id="nw-sum"></p>
</section>

<h2 id="dh" hidden>⏱️ 24 ชั่วโมงข้างหน้า <span id="tot"></span></h2>
<div id="tl"></div>

<p class="fine">พยากรณ์จากโมเดลสภาพอากาศ (Open-Meteo, CC BY 4.0) ความละเอียดหลายกิโลเมตร ไม่ใช่เรดาร์ตรวจจับจริง — ฝนเม็ดเดียวในซอยข้าง ๆ อาจไม่ตรงกับที่แอปบอกเสมอ แต่ใช้วางแผน "พกร่มไหม / ควรออกไปตอนไหน" ได้ดี</p>
</main>
<script>
const $=i=>document.getElementById(i);
const API='https://api.open-meteo.com/v1/forecast';
let cur=null; // {lat,lon,name,ts,h:{time,pp,pc,code,temp,cloud,isday}}

/* ---- WMO weathercode → กลุ่ม/ไอคอน/คำบรรยาย ---- */
const G={clear:[0],partly:[1,2],cloudy:[3],fog:[45,48],drizzle:[51,53,55,56,57],rain:[61,63,65,66,67,80,81,82],snow:[71,73,75,77,85,86],thunder:[95,96,99]};
const grp=c=>{for(const k in G)if(G[k].includes(c))return k;return 'cloudy'};
const ICON={clear:['☀️','🌙'],partly:['🌤️','☁️'],cloudy:['☁️','☁️'],fog:['🌫️','🌫️'],drizzle:['🌦️','🌦️'],rain:['🌧️','🌧️'],snow:['🌨️','🌨️'],thunder:['⛈️','⛈️']};
const LABEL={clear:'ฟ้าโล่ง ไม่มีฝน',partly:'มีเมฆบาง ไม่มีฝน',cloudy:'ฟ้าครึ้ม แต่ยังไม่มีฝน',fog:'มีหมอก',drizzle:'มีฝนปรอย ๆ',rain:'ฝนกำลังตก',snow:'หิมะตก',thunder:'พายุฝนฟ้าคะนอง'};

/* ---- หมวดของแต่ละชั่วโมง (สำหรับสรุป/ธีม) ---- */
const catOf=h=>{
 const g=grp(h.code);
 if(g==='thunder'||g==='snow')return g;
 if(g==='rain'||g==='drizzle')return(h.pc>=0.5||h.pp>=50)?'wet':'drizzle';
 return g;
};
const isWet=c=>c==='wet'||c==='drizzle'||c==='thunder';

function note(t,bad){const n=$('note');n.textContent=t;n.className='note'+(bad?' bad':'');n.hidden=!t}

/* ---- ธีมท้องฟ้า: crossfade 2 ชั้น + ดวงอาทิตย์/จันทร์ ---- */
let skyFlip=false;
function setTheme(day,wet){
 const cls='t-'+(day?'day':'night')+'-'+(wet?'wet':'dry');
 document.body.className=cls;
 const next=skyFlip?$('skyA'):$('skyB'),prev=skyFlip?$('skyB'):$('skyA');
 skyFlip=!skyFlip;next.classList.add('on');prev.classList.remove('on');
 const orb=$('orb');
 orb.textContent=day?'☀️':'🌙';
 orb.classList.toggle('moon',!day);
 document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).getPropertyValue('--sky1').trim()||'#5AA7E8';
}

/* ---- สรุปอัตโนมัติ: "ตอนนี้ฝนตก ฝนจะหยุดราว 17:00 น." ---- */
function summarize(hs){
 const c0=catOf(hs[0]),w0=isWet(c0);
 let change=-1;
 for(let i=1;i<Math.min(hs.length,24);i++){if(isWet(catOf(hs[i]))!==w0){change=i;break}}
 let s='ตอนนี้'+({wet:'ฝนกำลังตก',drizzle:'มีฝนปรอย ๆ',thunder:'มีพายุฝนฟ้าคะนอง',clear:'ฟ้าโล่ง ไม่มีฝน',partly:'ฟ้าใส มีเมฆบาง',cloudy:'ฟ้าครึ้ม แต่ยังไม่มีฝน',fog:'มีหมอก',snow:'หิมะกำลังตก'}[c0]);
 if(change>0){
  const t=new Date(hs[change].t*1000),hh=t.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  s+=w0?' · ฝนจะหยุดราว '+hh+' น.':' · ฝนจะเริ่มราว '+hh+' น.';
  const t0=new Date(hs[0].t*1000);
  if(t.getDate()!==t0.getDate())s+=' (พรุ่งนี้)';
 }else s+=w0?' · และคาดว่าฝนจะตกต่อเนื่องยาวถึง 24 ชม.':' · ไม่มีฝนถึงพรุ่งนี้เวลานี้เลย';
 return s;
}

function render(){
 if(!cur)return;
 const H=cur.h;
 const i0=Math.max(0,H.time.findIndex(t=>t*1000>Date.now()-18e5));
 const hs=[];for(let i=i0;i<Math.min(i0+24,H.time.length);i++)hs.push({t:H.time[i],pp:H.pp[i],pc:H.pc[i],code:H.code[i],temp:H.temp[i],isday:H.isday[i]});
 if(!hs.length){note('ยังไม่มีข้อมูลพยากรณ์ของช่วงเวลานี้',1);return}
 note('');
 // ธีมจากชั่วโมงปัจจุบัน
 setTheme(!!hs[0].isday,isWet(catOf(hs[0])));
 // การ์ดตอนนี้
 const c0=catOf(hs[0]);
 $('now').hidden=false;
 $('nw-icon').textContent=ICON[grp(hs[0].code)][hs[0].isday?0:1];
 $('nw-temp').innerHTML=Math.round(hs[0].temp)+'<small>°C</small>';
 $('nw-label').textContent=LABEL[c0]||LABEL[grp(hs[0].code)];
 $('nw-pp').textContent=hs[0].pp==null?'—':hs[0].pp+'%';
 $('nw-mm').textContent=hs[0].pc==null?'—':hs[0].pc+' มม.';
 $('nw-sum').textContent=summarize(hs);
 // ไทม์ไลน์
 $('dh').hidden=false;
 const today=new Date().getDate();
 let tot=0;hs.forEach(h=>{tot+=h.pc||0});
 $('tot').textContent='รวม ~'+Math.round(tot)+' มม.';
 $('tl').replaceChildren(...hs.map((h,i)=>{
  const d=document.createElement('div'),c=catOf(h);
  d.className='h '+(i===0?'now ':'')+(isWet(c)?'wet':'');
  const dt=new Date(h.t*1000);
  const tm=document.createElement('time');tm.textContent=(dt.getDate()!==today?'พรุ่งนี้ ':'')+dt.toLocaleTimeString('th-TH',{hour:'2-digit'})+':00';
  const ic=document.createElement('div');ic.className='ic';ic.textContent=ICON[grp(h.code)][h.isday?0:1];
  const tp=document.createElement('div');tp.className='tp';tp.textContent=Math.round(h.temp)+'°';
  const pp=document.createElement('span');
  if(h.pp!=null){pp.className='pp '+(h.pp>=60?'hi':h.pp>=30?'md':'lo');pp.textContent='💧'+h.pp+'%'}
  const mm=document.createElement('div');mm.className='mm';mm.textContent=(h.pc!=null&&h.pc>0)?h.pc+' มม.':'';
  d.append(tm,ic,tp,pp,mm);
  d.style.animationDelay=(i*0.035)+'s';
  return d;
 }));
 // เลื่อนไป "ตอนนี้"
 requestAnimationFrame(()=>{$('tl').scrollTo({left:0,behavior:'instant' in window?'instant':'auto'})});
 const m=(Date.now()-cur.ts)/6e4,ago=m<1?'เมื่อสักครู่':m<60?Math.round(m)+' นาทีที่แล้ว':Math.floor(m/60)+' ชม. '+Math.round(m%60)+' นาทีที่แล้ว';
 $('upd').textContent='📍 '+(cur.name||'จุดที่เลือก')+' · อัปเดต '+ago+' (แตะเพื่อรีเฟรช)';
}

async function load(lat,lon,name){
 $('upd').classList.add('spin');
 try{
  const u=API+'?latitude='+lat+'&longitude='+lon+'&timezone=Asia%2FBangkok&timeformat=unixtime&forecast_days=2&hourly=precipitation_probability,precipitation,weathercode,temperature_2m,cloud_cover,is_day';
  const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(),H=j.hourly;
  cur={lat,lon,name,ts:Date.now(),h:{time:H.time,pp:H.precipitation_probability,pc:H.precipitation,code:H.weathercode,temp:H.temperature_2m,cloud:H.cloud_cover,isday:H.is_day}};
  try{localStorage.setItem('raindata',JSON.stringify(cur));localStorage.setItem('rainloc',JSON.stringify({lat,lon,name}))}catch(e){}
  render();
 }catch(e){
  if(cur)note('อัปเดตไม่สำเร็จ ('+e.message+') — แสดงข้อมูลล่าสุดที่เก็บไว้',1);
  else note('ดึงข้อมูลไม่ได้ ('+e.message+') ตรวจสัญญาณเน็ตแล้วลองอีกครั้ง',1);
 }
 $('upd').classList.remove('spin');
}

/* ---- ตำแหน่ง / ค้นหา ---- */
$('gps').onclick=()=>{
 if(!navigator.geolocation){note('เบราว์เซอร์นี้ไม่รองรับ GPS',1);return}
 $('gps').textContent='📡 กำลังหาตำแหน่ง…';
 navigator.geolocation.getCurrentPosition(p=>{
  $('gps').textContent='📍 ใช้ตำแหน่งของฉัน';
  load(p.coords.latitude,p.coords.longitude,'ตำแหน่งของคุณ');
 },e=>{
  $('gps').textContent='📍 ใช้ตำแหน่งของฉัน';
  note(e.code===1?'🚫 ถูกบล็อกสิทธิ์ตำแหน่ง — แตะ 🔒 หน้า URL → Permissions → Location → Allow':e.code===2?'📵 ปิด GPS ของเครื่องอยู่ — เปิด Location services ก่อน':'⏱️ หาตำแหน่งไม่เจอใน 15 วิ ลองอีกครั้ง',1);
 },{timeout:15000,maximumAge:600000});
};
$('find').onclick=async()=>{
 const q=$('q').value.trim();if(!q)return;
 try{
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=4&language=th&name='+encodeURIComponent(q)).then(r=>r.json());
  $('chips').replaceChildren(...(r.results||[]).map(p=>{
   const b=document.createElement('button');b.type='button';
   b.textContent='📍 '+p.name+(p.admin1?' · '+p.admin1:'');
   b.onclick=()=>{$('chips').replaceChildren();load(p.latitude,p.longitude,p.name)};
   return b;
  }));
  if(!r.results||!r.results.length)note('ค้นหา "'+q+'" ไม่เจอ ลองชื่อใกล้เคียง',1);else note('');
 }catch(e){note('ค้นหาไม่ได้ ('+e.message+')',1)}
};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('find').click()});

/* ---- รีเฟรช: แตะบรรทัดอัปเดต ---- */
$('upd').onclick=()=>{if(cur)load(cur.lat,cur.lon,cur.name)};

/* ---- โหลดครั้งแรก: แสดงของเก่าทันที แล้วดึงใหม่ถ้าเก่าเกิน 10 นาที ---- */
(function init(){
 try{const s=JSON.parse(localStorage.getItem('raindata'));if(s&&s.h&&s.h.time&&s.h.time.length)cur=s}catch(e){}
 if(cur)render();else $('upd').textContent='เลือกตำแหน่งเพื่อเริ่ม';
 try{
  const L=JSON.parse(localStorage.getItem('rainloc'));
  if(L&&(!cur||Date.now()-cur.ts>6e5))load(L.lat,L.lon,L.name);
 }catch(e){}
})();
/* อัปเดตอัตโนมัติทุก 10 นาที ถ้าแท็บกำลังมองเห็นและข้อมูลเก่าเกิน 10 นาที */
setInterval(()=>{if(cur&&cur.lat&&document.visibilityState==='visible'&&Date.now()-cur.ts>6e5)load(cur.lat,cur.lon,cur.name)},6e5);
</script>
</body>
</html>
